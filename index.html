<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍵盤付きブラウザボコーダー</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
    }
    button#startBtn {
      background-color: #00ffcc;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    /* 鍵盤のスタイル */
    .keyboard {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      user-select: none;
    }
    .key {
      width: 45px;
      height: 150px;
      background: white;
      border: 1px solid #333;
      border-radius: 0 0 5px 5px;
      margin: 0 2px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: #333;
      font-weight: bold;
      font-size: 14px;
    }
    .key:active, .key.active {
      background: #00ffcc;
    }
  </style>
</head>
<body>

  <h1>鍵盤付きボコーダー🤖</h1>
  <p>※必ずイヤホンをつけてね！</p>
  
  <button id="startBtn">1. マイクをオンにする</button>
  
  <p>2. 下の鍵盤を押しながら喋ってみて！</p>

  <!-- 簡易鍵盤（ドレミファソラシド） -->
  <div class="keyboard">
    <div class="key" data-freq="261.63">ド</div>
    <div class="key" data-freq="293.66">レ</div>
    <div class="key" data-freq="329.63">ミ</div>
    <div class="key" data-freq="349.23">ファ</div>
    <div class="key" data-freq="392.00">ソ</div>
    <div class="key" data-freq="440.00">ラ</div>
    <div class="key" data-freq="493.88">シ</div>
    <div class="key" data-freq="523.25">高ド</div>
  </div>

  <script>
    let audioCtx;
    let micStream;
    let oscillator;
    let gainNode;

    document.getElementById('startBtn').addEventListener('click', async () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const micSource = audioCtx.createMediaStreamSource(micStream);

        // キャリア音（ボコーダーのベースとなる電子音）
        oscillator = audioCtx.createOscillator();
        oscillator.type = 'sawtooth'; 
        oscillator.frequency.value = 0; // 最初は音を鳴らさない

        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0; // 鍵盤を押すまで音量を0にする

        // マイクの音量変化をゲインに掛け合わせる
        micSource.connect(gainNode.gain);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();

        // ボタンの切り替え
        const btn = document.getElementById('startBtn');
        btn.textContent = "マイク準備OK🎤";
        btn.style.backgroundColor = "#ff4444";
        btn.style.color = "white";
        btn.disabled = true;

      } catch (err) {
        alert('マイクが許可されなかったよ😭');
        console.error(err);
      }
    });

    // 鍵盤を押したときの処理
    document.querySelectorAll('.key').forEach(key => {
      const freq = parseFloat(key.getAttribute('data-freq'));

      // スマホのタッチ操作対応
      key.addEventListener('touchstart', (e) => {
        e.preventDefault();
        playNote(freq, key);
      });
      key.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopNote(key);
      });

      // PCのクリック操作対応
      key.addEventListener('mousedown', () => playNote(freq, key));
      key.addEventListener('mouseup', () => stopNote(key));
      key.addEventListener('mouseleave', () => stopNote(key));
    });

    function playNote(freq, keyElement) {
      if (!audioCtx || audioCtx.state !== 'running') {
        alert('先に「マイクをオンにする」を押してね！');
        return;
      }
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime); // 音量をON
      keyElement.classList.add('active');
    }

    function stopNote(keyElement) {
      if (!audioCtx) return;
      gainNode.gain.setValueAtTime(0.0, audioCtx.currentTime); // 音量をOFF
      keyElement.classList.remove('active');
    }
  </script>

</body>
</html>
