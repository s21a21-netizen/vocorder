<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Vocoder - Mobile Real-time Modulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0a0b10',
                            panel: '#121520',
                            border: '#1e2538',
                            cyan: '#00f0ff',
                            green: '#39ff14',
                            pink: '#ff007f',
                            purple: '#9d00ff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0b10;
            color: #00f0ff;
            touch-action: manipulation;
        }
        .display-font {
            font-family: 'Orbitron', sans-serif;
        }
        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .glow-cyan-lg {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }
        .glow-green {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: #1e2538;
            height: 8px;
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00f0ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto select-none">

    <header class="text-center py-3 border-b border-cyber-border mb-4">
        <div class="inline-block px-3 py-1 rounded bg-cyber-border text-xs text-cyber-cyan tracking-widest uppercase mb-1">Mobile Web Audio Edition</div>
        <h1 class="display-font text-2xl font-black text-white tracking-wider">POCKET<span class="text-cyber-cyan">VOCODER</span></h1>
        <p class="text-xs text-gray-400 mt-1">Zero Cost Real-Time Voice Modulator</p>
    </header>

    <main class="flex-1 flex flex-col gap-4">
        <!-- Status & Audio Engine Card -->
        <div class="bg-cyber-panel border border-cyber-border rounded-xl p-4 glow-cyan flex flex-col items-center justify-center relative overflow-hidden">
            <div class="absolute top-2 right-3 flex items-center gap-2">
                <span id="status-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
                <span id="status-text" class="text-xs text-gray-400 uppercase tracking-wider">Standby</span>
            </div>

            <!-- Start / Stop Button -->
            <button id="toggle-btn" class="my-3 w-32 h-32 rounded-full border-4 border-cyber-cyan bg-cyber-dark text-cyber-cyan display-font font-bold text-sm tracking-widest flex flex-col items-center justify-center transition-all duration-200 active:scale-95 shadow-[0_0_20px_rgba(0,240,255,0.4)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
                </svg>
                <span id="btn-label">POWER ON</span>
            </button>
            <p class="text-[11px] text-gray-400 text-center mt-1">⚠️ ヘッドホン着用推奨（ハウリング防止）</p>
        </div>

        <!-- Visualizer Canvas -->
        <div class="bg-cyber-panel border border-cyber-border rounded-xl p-3 relative">
            <div class="text-[10px] text-gray-400 tracking-widest mb-1 uppercase">Spectrum Monitor</div>
            <canvas id="visualizer" class="w-full h-20 rounded bg-cyber-dark border border-cyber-border/50"></canvas>
        </div>

        <!-- Modulation & FX Controls -->
        <div class="bg-cyber-panel border border-cyber-border rounded-xl p-4 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-cyber-border pb-2">
                <span class="display-font text-xs text-white tracking-widest">EFFECT PARAMETERS</span>
                <span id="preset-badge" class="text-[10px] bg-cyber-cyan/20 text-cyber-cyan px-2 py-0.5 rounded border border-cyber-cyan/40">ROBO-CORE</span>
            </div>

            <!-- Carrier Waveform Select -->
            <div class="grid grid-cols-3 gap-2">
                <button data-wave="sawtooth" class="wave-btn py-2 px-2 rounded bg-cyber-dark border border-cyber-cyan text-xs text-cyber-cyan font-bold transition">SAW</button>
                <button data-wave="square" class="wave-btn py-2 px-2 rounded bg-cyber-dark border border-cyber-border text-xs text-gray-400 transition">SQUARE</button>
                <button data-wave="sine" class="wave-btn py-2 px-2 rounded bg-cyber-dark border border-cyber-border text-xs text-gray-400 transition">SINE</button>
            </div>

            <!-- Slider 1: Carrier Pitch -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-xs">
                    <span class="text-gray-300">Carrier Pitch (Hz)</span>
                    <span id="val-pitch" class="text-cyber-cyan display-font">110 Hz</span>
                </div>
                <input id="slider-pitch" type="range" min="50" max="440" step="5" value="110">
            </div>

            <!-- Slider 2: Modulation Depth / Ring Mix -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-xs">
                    <span class="text-gray-300">Modulation Depth</span>
                    <span id="val-depth" class="text-cyber-cyan display-font">80%</span>
                </div>
                <input id="slider-depth" type="range" min="0" max="100" step="1" value="80">
            </div>

            <!-- Slider 3: Robot Bitcrush / Distortion -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-xs">
                    <span class="text-gray-300">Distortion / Drive</span>
                    <span id="val-drive" class="text-cyber-cyan display-font">3.0x</span>
                </div>
                <input id="slider-drive" type="range" min="1" max="10" step="0.5" value="3.0">
            </div>
        </div>
    </main>

    <footer class="mt-4 text-center text-xs text-gray-500">
        <p>Host on GitHub Pages for instant free web access.</p>
    </footer>

    <script>
        let audioCtx = null;
        let micStream = null;
        let micSource = null;
        let oscillator = null;
        let modulatorGain = null;
        let carrierGain = null;
        let distortionNode = null;
        let analyser = null;
        let isRunning = false;

        const toggleBtn = document.getElementById('toggle-btn');
        const btnLabel = document.getElementById('btn-label');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Controls
        const sliderPitch = document.getElementById('slider-pitch');
        const valPitch = document.getElementById('val-pitch');
        const sliderDepth = document.getElementById('slider-depth');
        const valDepth = document.getElementById('val-depth');
        const sliderDrive = document.getElementById('slider-drive');
        const valDrive = document.getElementById('val-drive');
        const waveBtns = document.querySelectorAll('.wave-btn');

        let currentWaveform = 'sawtooth';

        // Resize canvas correctly for high-DPI screens
        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', setupCanvas);
        setupCanvas();

        // Create custom distortion curve for robotic crunch
        function makeDistortionCurve(amount) {
            let k = typeof amount === 'number' ? amount : 50;
            let n_samples = 44100;
            let curve = new Float32Array(n_samples);
            let deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                let x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        async function startAudioEngine() {
            try {
                // iOS Safari audio context initialization requires user gesture
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // Request microphone permissions with ideal constraints for voice
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // 1. Microphone Input Source
                micSource = audioCtx.createMediaStreamSource(micStream);

                // 2. Carrier Oscillator (The Robot Synth Voice)
                oscillator = audioCtx.createOscillator();
                oscillator.type = currentWaveform;
                oscillator.frequency.setValueAtTime(parseFloat(sliderPitch.value), audioCtx.currentTime);

                // 3. Modulator Gain (Controls Ring Modulation / Amplitude Modulation depth)
                modulatorGain = audioCtx.createGain();
                const depthVal = parseFloat(sliderDepth.value) / 100;
                modulatorGain.gain.setValueAtTime(depthVal, audioCtx.currentTime);

                // 4. Carrier Gain
                carrierGain = audioCtx.createGain();
                carrierGain.gain.setValueAtTime(0.5, audioCtx.currentTime);

                // 5. Distortion Node for robotic grit
                distortionNode = audioCtx.createWaveShaper();
                distortionNode.curve = makeDistortionCurve(parseFloat(sliderDrive.value) * 10);
                distortionNode.oversample = '4x';

                // 6. Analyser for Visualizer
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                // --- AUDIO ROUTING (Ring Modulation Network) ---
                // Mic signal acts as amplitude control for the oscillator (or vice-versa for basic vocoder effect)
                // In Web Audio API, multiplying two audio signals is achieved by connecting a GainNode's gain input.
                
                // Route oscillator into carrierGain, then into modulatorGain.gain to modulate mic volume
                oscillator.connect(carrierGain);
                carrierGain.connect(modulatorGain.gain);

                micSource.connect(modulatorGain);
                modulatorGain.connect(distortionNode);
                distortionNode.connect(analyser);
                
                // Connect to destination (Headphones/Speaker)
                analyser.connect(audioCtx.destination);

                oscillator.start();

                // UI State Update
                isRunning = true;
                btnLabel.textContent = "STOP";
                toggleBtn.classList.remove('border-cyber-cyan', 'shadow-[0_0_20px_rgba(0,240,255,0.4)]');
                toggleBtn.classList.add('border-cyber-pink', 'shadow-[0_0_25px_rgba(255,0,127,0.6)]', 'text-cyber-pink');
                statusDot.classList.remove('bg-red-500');
                statusDot.classList.add('bg-cyber-green', 'glow-green');
                statusText.textContent = "ACTIVE (LIVE)";
                statusText.classList.add('text-cyber-green');

                drawVisualizer();

            } catch (err) {
                console.error("Audio initialization error:", err);
                alert("マイクへのアクセスが拒否されたか、ブラウザが対応していません。設定を確認してください。");
            }
        }

        function stopAudioEngine() {
            if (oscillator) {
                try { oscillator.stop(); } catch(e){}
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            if (audioCtx) {
                audioCtx.close();
            }

            isRunning = false;
            btnLabel.textContent = "POWER ON";
            toggleBtn.classList.remove('border-cyber-pink', 'shadow-[0_0_25px_rgba(255,0,127,0.6)]', 'text-cyber-pink');
            toggleBtn.classList.add('border-cyber-cyan', 'shadow-[0_0_20px_rgba(0,240,255,0.4)]', 'text-cyber-cyan');
            statusDot.classList.remove('bg-cyber-green', 'glow-green');
            statusDot.classList.add('bg-red-500');
            statusText.textContent = "STANDBY";
            statusText.classList.remove('text-cyber-green');
        }

        toggleBtn.addEventListener('click', () => {
            if (!isRunning) {
                startAudioEngine();
            } else {
                stopAudioEngine();
            }
        });

        // Real-time Visualizer Loop
        function drawVisualizer() {
            if (!isRunning) return;
            requestAnimationFrame(drawVisualizer);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            canvasCtx.fillStyle = '#0a0b10';
            canvasCtx.fillRect(0, 0, width, height);

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00f0ff';
            canvasCtx.beginPath();

            const sliceWidth = width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                let v = dataArray[i] / 128.0;
                let y = v * height / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }

                x += sliceWidth;
            }

            canvasCtx.lineTo(width, height / 2);
            canvasCtx.stroke();
        }

        // Event Listeners for Controls
        sliderPitch.addEventListener('input', (e) => {
            const val = e.target.value;
            valPitch.textContent = val + " Hz";
            if (oscillator && audioCtx) {
                oscillator.frequency.setValueAtTime(parseFloat(val), audioCtx.currentTime);
            }
        });

        sliderDepth.addEventListener('input', (e) => {
            const val = e.target.value;
            valDepth.textContent = val + "%";
            if (modulatorGain && audioCtx) {
                modulatorGain.gain.setValueAtTime(parseFloat(val) / 100, audioCtx.currentTime);
            }
        });

        sliderDrive.addEventListener('input', (e) => {
            const val = e.target.value;
            valDrive.textContent = val + "x";
            if (distortionNode && audioCtx) {
                distortionNode.curve = makeDistortionCurve(parseFloat(val) * 10);
            }
        });

        waveBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                waveBtns.forEach(b => {
                    b.classList.remove('border-cyber-cyan', 'text-cyber-cyan');
                    b.classList.add('border-cyber-border', 'text-gray-400');
                });
                const target = e.target;
                target.classList.remove('border-cyber-border', 'text-gray-400');
                target.classList.add('border-cyber-cyan', 'text-cyber-cyan');

                currentWaveform = target.getAttribute('data-wave');
                if (oscillator) {
                    oscillator.type = currentWaveform;
                }
            });
        });
    </script>
</body>
</html>
